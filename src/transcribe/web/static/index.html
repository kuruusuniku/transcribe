<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transcribe Web UI</title>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #ffffff;
      --surface: #f6f8fa;
      --border: #d0d7de;
      --text: #1f2328;
      --text-dim: #656d76;
      --accent: #0969da;
      --btn-bg: #f6f8fa;
      --btn-hover: #eaeef2;
      --done: #1a7f37;
      --failed: #cf222e;
      --running: #0969da;
      --queued: #9a6700;
    }

    [data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --btn-bg: #21262d;
      --btn-hover: #30363d;
      --done: #3fb950;
      --failed: #f85149;
      --running: #58a6ff;
      --queued: #d29922;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace;
      font-size: 13px;
      height: 100vh;
      overflow: hidden;
    }

    #root { height: 100vh; display: flex; flex-direction: column; }

    .app-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .app-header h1 { font-size: 15px; font-weight: 600; color: var(--text); }

    .running-badge {
      background: var(--running);
      color: #000;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    .app-main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }

    .sidebar-header {
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border);
    }

    .job-list { flex: 1; overflow-y: auto; }

    .job-item {
      padding: 8px 12px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .job-item:hover { background: var(--btn-hover); }
    .job-item.selected { background: var(--btn-hover); border-left: 2px solid var(--accent); color: var(--text); }

    .job-item-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .job-id { color: var(--text-dim); font-size: 11px; }

    .job-title {
      color: var(--text);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      padding: 1px 6px;
      border-radius: 8px;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .command-panel {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .url-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      font-family: monospace;
      resize: vertical;
    }

    .url-input:focus { outline: none; border-color: var(--accent); }

    .action-row {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button, .file-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    button:hover:not(:disabled), .file-btn:hover { background: var(--btn-hover); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    button.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      font-weight: 600;
    }

    button.primary:hover:not(:disabled) { opacity: 0.85; }

    .log-viewer {
      overflow-y: auto;
      padding: 8px 16px;
      font-family: 'Consolas', 'Monaco', monospace;
      font-size: 12px;
      line-height: 1.5;
      background: var(--bg);
    }

    .log-line { color: var(--text-dim); white-space: pre-wrap; word-break: break-all; }
    .log-line.done { color: var(--done); }
    .log-line.error { color: var(--failed); }

    .log-empty {
      color: var(--text-dim);
      font-style: italic;
      padding: 8px 0;
    }

    .job-detail {
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
      max-height: 40%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .detail-header {
      padding: 8px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .detail-header h3 { font-size: 13px; font-weight: 600; }

    .detail-header .detail-url {
      flex: 1;
      color: var(--text-dim);
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .detail-actions { display: flex; gap: 6px; }

    .file-view {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px;
    }

    .file-view pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 12px;
      color: var(--text);
      line-height: 1.6;
    }

    .separator { flex-shrink: 0; height: 4px; background: var(--border); cursor: row-resize; }

    .filter-row {
      display: flex;
      gap: 4px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .filter-btn {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-dim);
      cursor: pointer;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" src="/static/app.jsx" data-presets="react"></script>
</body>
</html>
