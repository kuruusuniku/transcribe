[project]
name = "transcribe"
version = "0.1.0"
description = "YouTube動画 自動文字起こしツール"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "yt-dlp>=2024.1.0",
    "faster-whisper>=1.0.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "typer>=0.12.0",
    "torch>=2.5.0",
    "torchaudio>=2.5.0",
    "demucs==4.0.1",
    "soundfile>=0.13.1",
    "google-api-python-client>=2.0",
    "google-auth-httplib2>=0.1",
    "google-auth-oauthlib>=1.0",
    "google-genai>=1.0",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "notion-client>=3.1.0",
]

[project.scripts]
transcribe = "transcribe.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcribe"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu124" },
]
torchaudio = [
    { index = "pytorch-cu124" },
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]