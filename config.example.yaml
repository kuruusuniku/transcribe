# API キー・トークンは `transcribe secrets set <name>` で OS の保管庫に保存するのがおすすめです。
# 読み込みの優先順位: OS の保管庫（keyring）→ 環境変数 → この config.yaml。
# name: gemini_api_key / anthropic_api_key / notion_token / web_token

paths:
  work_dir: ./data/work
  output_dir: ./data/output
  state_db: ./data/state.db
  log_dir: ./logs

youtube:
  # ブラウザCookieを使用（限定公開動画用）
  # 選択肢: chrome / firefox / edge / brave / none
  # none を指定するとCookieなしでDL（公開動画のテスト用）
  #
  # 【重要】Windowsでは Firefox を推奨します。
  # Chrome 127以降は App-Bound Encryption により yt-dlp から Cookie を
  # 読み出せなくなりました。Edge も同じChromiumベースのため同様の問題が
  # 発生する可能性があります。Firefox はこの制限がないため安定動作します。
  # Mac ではこの制限はなく、safari も指定できます。
  cookies_from_browser: firefox

audio_separation:
  # ボーカル分離（BGM除去）
  #
  # 【検証結果】このプロジェクトの稽古指導動画では
  # Demucs を有効化すると逆に精度が低下することが判明（2026-05-10）。
  # ボーカル分離が人声の微細な音響特徴を削るため、Whisper の認識精度に
  # 悪影響が出る。BGM が小さい動画では基本的に false を推奨。
  #
  # BGM が大きい動画(音楽が主、人声が背景)では効果がある可能性あり。
  # 必要に応じて切り替えて使用すること。
  #
  # 1時間動画での処理時間追加: 約50分(VRAM 4GB環境)
  enabled: false
  model: htdemucs
  device: cuda   # Mac は cpu

transcription:
  model: large-v3-turbo   # large-v3 より約 3〜5 倍速い（精度はほぼ同等）。精度優先なら large-v3
  # 量子化設定（環境に応じて選択）
  # int8           : VRAM 4GB前後の旧世代GPU向け（Pascal/Turing等、Tensor Core非対応環境）
  # int8_float16   : VRAM 4-6GBのTensor Core対応GPU向け（推奨）
  # float16        : VRAM 8GB以上の環境向け（高品質）
  # float32        : 最高品質（VRAM 12GB以上推奨）
  # Mac（GPU 非対応・CPU で実行）は device: cpu / compute_type: int8 にする
  compute_type: int8_float16
  device: cuda
  language: ja
  beam_size: 5
  condition_on_previous_text: false  # ハルシネーション連鎖防止
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 1000
    threshold: 0.5
    speech_pad_ms: 200
  # initial_prompt は glossary.yaml から自動生成

output:
  timestamp_interval_seconds: 30   # 1 区切りの最大の長さ（秒）。見出しの時刻は実際に話し始めた時刻
  paragraph_gap_seconds: 1.0       # この長さ以上の無音があれば区切る
  segment_timestamps: false        # true にすると各発言の先頭にも実際の開始時刻を付ける
  confidence_threshold: -1.0

# ローカルファイル対応
# urls.txt にファイルパスを記載するか、`transcribe file <path>` で直接指定可能
# 対応形式: .mp3, .m4a。URL とローカルパスの混在が可能。
# .m4a は内部で文字起こしできるほか、`transcribe convert <path>` で .mp3 に変換も可能。
# 例:
#   https://www.youtube.com/watch?v=abc123
#   C:\Users\sttmn\recordings\keiko.mp3
#   C:\Users\sttmn\recordings\session.m4a
#   ./data/audio/session.mp3

retry:
  max_attempts: 3
  backoff_seconds: [60, 300, 900]

logging:
  level: INFO
  console: true
  file: true
  retention_days: 30      # これより古いログファイルは起動時に削除（0 で無効）

google_docs:
  enabled: false                    # true にすると パイプライン完了時に自動同期
  credentials_path: credentials.json
  token_path: token.json            # 自動生成（gitignore 対象）
  root_folder_id: ""                # Google Drive のルートフォルダ ID

web:
  host: "127.0.0.1"   # 外部公開する場合は "0.0.0.0"（セキュリティリスクあり）
  port: 8000
  token: ""           # 設定するとトークン認証が有効（環境変数 TRANSCRIBE_WEB_TOKEN でも可）。
                      # 初回は http://host:port/?token=<token> でアクセスすると Cookie が発行される。
                      # host が 127.0.0.1 以外の場合は必須。

notion:
  # Notion データベースへの自動同期（summary.md が存在するジョブのみ対象）
  #
  # 使い方:
  #   1. Notion インテグレーションを作成: https://www.notion.so/my-integrations
  #   2. token に "Internal Integration Secret" を設定
  #   3. database_id に同期先 DB の ID を設定（URL の末尾 32 桁）
  #   4. DB にインテグレーションを接続（DB ページの「...」→「接続」）
  #   5. enabled: true に設定するとパイプライン完了時に自動実行
  #
  # DB に必要なプロパティ（名前・型）:
  #   名前 (title), 日付 (date), URL (url), 動画時間 (number),
  #   ソース種別 (select), まとめ進捗 (checkbox), タグ (multi_select)
  #
  # 手動実行: uv run transcribe sync-notion          （未同期のdoneジョブのみ）
  #          uv run transcribe sync-notion --all
  #          uv run transcribe sync-notion --id 13
  enabled: false
  token: ""             # Notion Internal Integration Secret（secrets set notion_token / 環境変数 NOTION_TOKEN でも可）
  database_id: ""       # 同期先 DB の ID（32 桁英数字）
  local_database_id: ""  # 叡智講義（録音ファイル）用 Notion DB ID（空なら database_id を使用）

notification:
  enabled: false
  to_email: ""  # 送信先メールアドレス（Gmail OAuth の認証アカウントから送信）

summarize:
  # LLM による自動カスタムまとめ生成（KYOTA 式構造化まとめ）
  #
  # 使い方:
  #   1. provider を選択（gemini 推奨: 無料枠あり）
  #   2. 対応するAPIキーを設定（または環境変数 GEMINI_API_KEY / ANTHROPIC_API_KEY）
  #   3. enabled: true に設定するとパイプライン完了時に自動実行
  #
  # 手動実行: uv run transcribe summarize  （未まとめのdoneジョブのみ）
  #          uv run transcribe summarize --all
  #          uv run transcribe summarize --id 13
  #
  # Gemini APIキー発行: https://aistudio.google.com/apikey
  # Anthropic APIキー発行: https://console.anthropic.com/
  enabled: false
  provider: gemini                  # "gemini" or "claude"
  gemini_api_key: ""                # または環境変数 GEMINI_API_KEY
  gemini_model: "gemini-2.5-flash"
  anthropic_api_key: ""             # または環境変数 ANTHROPIC_API_KEY
  anthropic_model: "claude-haiku-4-5-20251001"
  max_output_tokens: 16384   # 長い講義・動画で足りない場合は増やす（Gemini 2.5 Flash は 65536 まで）
  temperature: 0.3                  # 構造化まとめには低めが推奨