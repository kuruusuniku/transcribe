paths:
  work_dir: ./data/work
  output_dir: ./data/output
  state_db: ./data/state.db
  log_dir: ./logs

youtube:
  # ブラウザCookieを使用（限定公開動画用）
  # 選択肢: chrome / firefox / edge / brave / none
  # none を指定するとCookieなしでDL（公開動画のテスト用）
  #
  # 【重要】Windowsでは Firefox を推奨します。
  # Chrome 127以降は App-Bound Encryption により yt-dlp から Cookie を
  # 読み出せなくなりました。Edge も同じChromiumベースのため同様の問題が
  # 発生する可能性があります。Firefox はこの制限がないため安定動作します。
  cookies_from_browser: firefox

audio_separation:
  # ボーカル分離（BGM除去）
  #
  # 【検証結果】このプロジェクトの稽古指導動画では
  # Demucs を有効化すると逆に精度が低下することが判明（2026-05-10）。
  # ボーカル分離が人声の微細な音響特徴を削るため、Whisper の認識精度に
  # 悪影響が出る。BGM が小さい動画では基本的に false を推奨。
  #
  # BGM が大きい動画(音楽が主、人声が背景)では効果がある可能性あり。
  # 必要に応じて切り替えて使用すること。
  #
  # 1時間動画での処理時間追加: 約50分(VRAM 4GB環境)
  enabled: false
  model: htdemucs
  device: cuda

transcription:
  model: large-v3
  # 量子化設定（環境に応じて選択）
  # int8           : VRAM 4GB前後の旧世代GPU向け（Pascal/Turing等、Tensor Core非対応環境）
  # int8_float16   : VRAM 4-6GBのTensor Core対応GPU向け（推奨）
  # float16        : VRAM 8GB以上の環境向け（高品質）
  # float32        : 最高品質（VRAM 12GB以上推奨）
  compute_type: int8_float16
  device: cuda
  language: ja
  beam_size: 5
  condition_on_previous_text: false  # ハルシネーション連鎖防止
  vad_filter: true
  vad_parameters:
    min_silence_duration_ms: 1000
    threshold: 0.5
    speech_pad_ms: 200
  # initial_prompt は glossary.yaml から自動生成

output:
  timestamp_interval_seconds: 60
  confidence_threshold: -1.0

# ローカルファイル対応
# urls.txt にファイルパスを記載するか、`transcribe file <path>` で直接指定可能
# 現在 MP3 のみ対応。URL とローカルパスの混在が可能。
# 例:
#   https://www.youtube.com/watch?v=abc123
#   C:\Users\sttmn\recordings\keiko.mp3
#   ./data/audio/session.mp3

retry:
  max_attempts: 3
  backoff_seconds: [60, 300, 900]

logging:
  level: INFO
  console: true
  file: true

google_docs:
  enabled: false                    # true にすると パイプライン完了時に自動同期
  credentials_path: credentials.json
  token_path: token.json            # 自動生成（gitignore 対象）
  root_folder_id: ""                # Google Drive のルートフォルダ ID

summarize:
  # LLM による自動カスタムまとめ生成（KYOTA 式構造化まとめ）
  #
  # 使い方:
  #   1. provider を選択（gemini 推奨: 無料枠あり）
  #   2. 対応するAPIキーを設定（または環境変数 GEMINI_API_KEY / ANTHROPIC_API_KEY）
  #   3. enabled: true に設定するとパイプライン完了時に自動実行
  #
  # 手動実行: uv run transcribe summarize  （未まとめのdoneジョブのみ）
  #          uv run transcribe summarize --all
  #          uv run transcribe summarize --id 13
  #
  # Gemini APIキー発行: https://aistudio.google.com/apikey
  # Anthropic APIキー発行: https://console.anthropic.com/
  enabled: false
  provider: gemini                  # "gemini" or "claude"
  gemini_api_key: ""                # または環境変数 GEMINI_API_KEY
  gemini_model: "gemini-2.5-flash"
  anthropic_api_key: ""             # または環境変数 ANTHROPIC_API_KEY
  anthropic_model: "claude-haiku-4-5-20251001"
  max_output_tokens: 8192
  temperature: 0.3                  # 構造化まとめには低めが推奨